name: TPB Lockfile Resolver

on:
  push:
    branches:
      - 'scratch/tpb-lockgen-20260828'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - name: Install current stable with Clippy and rustfmt
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Install nightly fuzz toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz into isolated prefix
        run: cargo +stable install cargo-fuzz --locked --root "$RUNNER_TEMP/tpb-cargo-fuzz"
      - name: Generate root and fuzz lockfiles with MSRV Cargo
        run: |
          cargo +1.85.0 generate-lockfile --manifest-path tpb-lockgen/Cargo.toml
          cargo +1.85.0 generate-lockfile --manifest-path tpb-lockgen/fuzz/Cargo.toml
      - name: Verify root dependency graph on Rust 1.85
        run: cargo +1.85.0 check --manifest-path tpb-lockgen/Cargo.toml --workspace --all-targets --locked
      - name: Verify fuzz lockfile resolves
        run: cargo +1.85.0 metadata --manifest-path tpb-lockgen/fuzz/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Vendor public dependencies for offline private-source validation
        run: |
          cargo +1.85.0 vendor --locked --manifest-path tpb-lockgen/Cargo.toml tpb-lockgen/vendor-root >/dev/null
          cargo +1.85.0 vendor --locked --manifest-path tpb-lockgen/fuzz/Cargo.toml tpb-lockgen/vendor-fuzz >/dev/null
      - name: Upload offline vendor bundle
        uses: actions/upload-artifact@v4
        with:
          name: tpb-offline-vendor
          path: |
            tpb-lockgen/vendor-root
            tpb-lockgen/vendor-fuzz
          include-hidden-files: true
          compression-level: 6
          retention-days: 1
      - name: Pack Rust 1.85 and stable toolchains
        run: |
          tar -C "$HOME/.rustup/toolchains" -czf tpb-rust-toolchains.tar.gz \
            1.85.0-x86_64-unknown-linux-gnu stable-x86_64-unknown-linux-gnu
      - name: Upload offline Rust toolchains
        uses: actions/upload-artifact@v4
        with:
          name: tpb-rust-toolchains
          path: tpb-rust-toolchains.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Pack nightly and cargo-fuzz
        run: |
          NIGHTLY_DIR="$(basename "$(rustc +nightly --print sysroot)")"
          mkdir -p tpb-fuzz-tools
          tar -C "$HOME/.rustup/toolchains" -czf tpb-fuzz-tools/nightly-toolchain.tar.gz "$NIGHTLY_DIR"
          cp "$RUNNER_TEMP/tpb-cargo-fuzz/bin/cargo-fuzz" tpb-fuzz-tools/cargo-fuzz
          chmod +x tpb-fuzz-tools/cargo-fuzz
          "$RUNNER_TEMP/tpb-cargo-fuzz/bin/cargo-fuzz" --version
      - name: Upload nightly fuzz tools
        uses: actions/upload-artifact@v4
        with:
          name: tpb-fuzz-tools
          path: tpb-fuzz-tools
          compression-level: 0
          retention-days: 1
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+UglyGameFace@users.noreply.github.com"
          git add tpb-lockgen/Cargo.lock tpb-lockgen/fuzz/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
          else
            git commit -m "scratch: resolve TPB lockfiles [skip ci]"
            git push origin HEAD:scratch/tpb-lockgen-20260828
          fi
